[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "HXEnsemble"
version = "1.0.0"
description = "Amide hydrogen exchange forward models and ensemble reweighting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2", "mdtraj>=1.10", "openmm>=8", "matplotlib>=3.7", "threadpoolctl>=3"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
hxensemble-forward = "hxensemble.cli:forward_main"
hxensemble-nmr = "hxensemble.cli:nmr_main"
hxensemble-ms = "hxensemble.cli:ms_main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hxensemble = ["data/*.json"]
